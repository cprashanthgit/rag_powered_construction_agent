# deploy/streamlit-secrets.example.toml
# ══════════════════════════════════════════════════════════════════════
# Streamlit Cloud secrets template
#
# INSTRUCTIONS:
#   Streamlit Cloud dashboard → your app → Settings → Secrets
#   Paste the block below (with your real VM URL) and Save.
#
# Streamlit will inject these as st.secrets["KEY"] at runtime.
# ══════════════════════════════════════════════════════════════════════

# Your GCP VM backend URL — must use HTTPS
# Example with domain:  "https://api.myproject.com"
# Example with IP only: "https://34.123.45.67"  (needs self-signed cert workaround)
API_BASE_URL = "https://YOUR_DOMAIN_OR_VM_IP"
