global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'cnst-api'
    static_configs:
      - targets: ['api:8000']     # FastAPI container on Docker internal network
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
